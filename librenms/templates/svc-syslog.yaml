{{- if .Values.syslog.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: syslog
  namespace: {{ $.Release.Namespace }}
  labels:
    app: syslog
spec:
  type: NodePort
  ports:
    - name: syslog-udp
      protocol: UDP
      port: 514
      nodePort: 32514
  selector:
    app: syslog
---
{{- end }}
