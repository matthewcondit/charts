{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # Remove deprecated kubernetes.io/ingress.class annotation
spec:
  ingressClassName: traefik # Replace with your ingress controller's class name
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ .name }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .name }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
    {{- end }}
{{- end }}

