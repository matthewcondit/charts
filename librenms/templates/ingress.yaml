apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librenms-ingress
  namespace: {{ .Values.namespace }}
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.librenms }}
        - {{ .Values.ingress.hosts.graylog }}
        - {{ .Values.ingress.hosts.oxidized }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.hosts.librenms }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: librenms
                port:
                  number: {{ .Values.librenms.servicePort }}
    - host: {{ .Values.ingress.hosts.graylog }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graylog
                port:
                  number: {{ .Values.graylog.servicePort }}
    - host: {{ .Values.ingress.hosts.oxidized }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oxidized
                port:
                  number: {{ .Values.oxidized.servicePort }}
