{{- if .Values.dispatcher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librenms-dispatcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: librenms-dispatcher
spec:
  replicas: {{ .Values.dispatcher.replicaCount }}
  selector:
    matchLabels:
      app: librenms-dispatcher
  template:
    metadata:
      labels:
        app: librenms-dispatcher
    spec:
      containers:
        - name: dispatcher
          image: "{{ .Values.dispatcher.image }}"
          env:
            - name: DB_HOST
              value: {{ .Values.librenms.env.DB_HOST }}
            - name: DB_NAME
              value: {{ .Values.librenms.env.DB_NAME }}
            - name: DB_USER
              value: {{ .Values.librenms.env.DB_USER }}
            - name: DB_PASSWORD
              value: {{ .Values.librenms.env.DB_PASSWORD }}
            - name: REDIS_HOST
              value: {{ .Values.librenms.env.REDIS_HOST }}
            - name: REDIS_PORT
              value: "{{ .Values.librenms.env.REDIS_PORT }}"
            - name: PUID
              value: "{{ .Values.librenms.env.PUID }}"
            - name: PGID
              value: "{{ .Values.librenms.env.PGID }}"
            - name: TZ
              value: "{{ .Values.librenms.env.TZ }}"
            - name: LIBRENMS_BASE_URL
              value: "{{ .Values.librenms.env.LIBRENMS_BASE_URL }}"
            - name: SESSION_SECURE_COOKIE
              value: "{{ .Values.librenms.env.SESSION_SECURE_COOKIE }}"
            - name: CACHE_DRIVER
              value: "{{ .Values.librenms.env.CACHE_DRIVER }}"
            - name: SESSION_DRIVER
              value: "{{ .Values.librenms.env.SESSION_DRIVER }}"
            - name: LIBRENMS_SNMP_COMMUNITY
              value: "{{ .Values.librenms.env.LIBRENMS_SNMP_COMMUNITY }}"
            - name: LIBRENMS_WEATHERMAP
              value: "{{ .Values.librenms.env.LIBRENMS_WEATHERMAP }}"
            - name: SIDECAR_DISPATCHER
              value: 1
            - name: DISPATCHER_NODE_ID
              value: "{{ .Values.dispatcher.env.DISPATCHER_NODE_ID }}"
          ports:
            - containerPort: {{ .Values.dispatcher.service.port }}
{{- end }}
