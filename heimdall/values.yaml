replicaCount: 1

image:
  repository: linuxserver/heimdall
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

tls:
  enabled: true
  secretName: heimdall-tls
  cert: |-
    -----BEGIN CERTIFICATE-----
    YOUR_CERTIFICATE_CONTENT
    -----END CERTIFICATE-----
  key: |-
    -----BEGIN PRIVATE KEY-----
    YOUR_PRIVATE_KEY_CONTENT
    -----END PRIVATE KEY-----

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: "nginx"
  hosts:
    - host: heimdall.verobroadband.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: heimdall-tls
      hosts:
        - heimdall.verobroadband.com
